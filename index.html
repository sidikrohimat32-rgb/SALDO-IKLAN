<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Pantau Saldo Iklan</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/modern-screenshot"></script>
    <style>
        /* Sembunyikan panah atas-bawah di input number browser */
        input[type="text"] { font-variant-numeric: tabular-nums; }
    </style>
</head>
<body class="bg-gradient-to-br from-gray-900 via-slate-900 to-gray-800 text-gray-100 min-h-screen p-4 md:p-8 font-sans">

    <div class="max-w-7xl mx-auto">
        <div class="flex flex-col md:flex-row md:items-end md:justify-between mb-8 gap-4 bg-gray-800/50 p-6 rounded-2xl border border-gray-700/50 shadow-lg backdrop-blur-sm">
            <div>
                <h1 class="text-3xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-blue-400 to-emerald-400 tracking-tight">
                    📊 Ads Balance Monitor
                </h1>
                <p class="text-gray-400 text-sm mt-2">Pantau sisa saldo dan estimasi umur iklan. <br/>Kalkulasi berdasarkan: <code class="bg-gray-900 text-amber-300 px-2 py-0.5 rounded text-xs">Saldo / (Spend + Persentase PPN)</code></p>
                <div class="mt-3 flex items-center gap-2 text-xs font-semibold text-gray-500 uppercase tracking-wider">
                    <span>📅 <span id="current-date"></span></span>
                </div>
            </div>
            <div class="flex flex-wrap gap-3">
                <button onclick="downloadReport()" class="bg-gradient-to-r from-emerald-500 to-green-600 hover:from-emerald-400 hover:to-green-500 text-white font-bold py-2 px-5 rounded-xl shadow-lg shadow-green-900/20 transition-all duration-300 flex items-center gap-2 cursor-pointer border border-green-400/20">
                    📸 Download Report
                </button>
                <button onclick="clearAllData()" class="bg-gray-800 hover:bg-red-900/40 text-red-400 hover:text-red-300 border border-gray-700 hover:border-red-500/50 font-semibold py-2 px-5 rounded-xl transition-all duration-300 cursor-pointer flex items-center gap-2">
                    🗑️ Reset Data
                </button>
            </div>
        </div>

        <div id="report-container" class="space-y-6 bg-[#0f172a] p-6 rounded-2xl border border-slate-800/50">
        </div>
        
    </div>

    <script>
        // Data Struktur Grup Akun Iklan
        const accountGroups = [
            {
                id: "group1",
                title: "Tim Nisa, Daily & Findurfav",
                theme: "blue",
                accounts: [
                    "NISA TESTER",
                    "KANTOR MJO 1372 (RAHASIA CANTIK)",
                    "KANTOR MJO 0696 (DAILY CK)",
                    "KANTOR MJO 0682 (FINDURFAV)"
                ]
            },
            {
                id: "group2",
                title: "Tim Dapur",
                theme: "amber",
                accounts: [
                    "AKUN IKLAN BARU (DAPUR)",
                    "KANTOR MJO 0435 (DAPUR)"
                ]
            },
            {
                id: "group3",
                title: "Tim Evan, Racoen & Shopping",
                theme: "purple",
                accounts: [
                    "AKUN IKLAN EVAN (RACOEN)",
                    "KANTOR MJO 0434 (RACOEN)",
                    "KANTOR MJO-1478 (EASY SHOPPING)"
                ]
            }
        ];

        // Format Tanggal
        const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
        document.getElementById('current-date').innerText = new Date().toLocaleDateString('id-ID', options);

        function getSafeId(name) {
            return name.replace(/[^a-zA-Z0-9]/g, '_');
        }

        const container = document.getElementById('report-container');

        // Fungsi Render Tabel Berdasarkan Grup
        function renderTables() {
            accountGroups.forEach(group => {
                let headerColor, borderColor, icon;
                if(group.theme === 'blue') { headerColor = 'text-blue-400'; borderColor = 'border-blue-500/30'; icon = '🔹'; }
                else if(group.theme === 'amber') { headerColor = 'text-amber-400'; borderColor = 'border-amber-500/30'; icon = '🔸'; }
                else { headerColor = 'text-purple-400'; borderColor = 'border-purple-500/30'; icon = '🔮'; }

                const groupHTML = `
                    <div class="bg-gray-800/80 rounded-xl overflow-hidden border border-gray-700/60 shadow-md">
                        <div class="bg-gray-800 px-5 py-3 border-b border-gray-700/80 flex items-center gap-2">
                            <span class="text-lg">${icon}</span>
                            <h2 class="font-bold text-lg ${headerColor} uppercase tracking-wide">${group.title}</h2>
                        </div>
                        <div class="overflow-x-auto p-2">
                            <table class="w-full text-left border-collapse">
                                <thead>
                                    <tr class="border-b border-gray-700/50 text-gray-400 text-xs uppercase tracking-wider">
                                        <th class="pb-2 pt-2 px-3 font-semibold min-w-[200px]">Nama Akun</th>
                                        <th class="pb-2 pt-2 px-2 font-semibold min-w-[120px] text-center">Batas Sewa</th>
                                        <th class="pb-2 pt-2 px-2 font-semibold min-w-[150px] text-right">Saldo Saat Ini</th>
                                        <th class="pb-2 pt-2 px-2 font-semibold min-w-[150px] text-right">Spend Iklan</th>
                                        <th class="pb-2 pt-2 px-2 font-semibold min-w-[80px] text-center">PPN (%)</th>
                                        <th class="pb-2 pt-2 px-2 font-semibold min-w-[150px] text-right ${headerColor}">Total Harian</th>
                                        <th class="pb-2 pt-2 px-3 font-semibold text-center min-w-[150px]">Estimasi Sisa</th>
                                    </tr>
                                </thead>
                                <tbody class="divide-y divide-gray-700/30" id="tbody_${group.id}">
                                </tbody>
                            </table>
                        </div>
                    </div>
                `;
                container.insertAdjacentHTML('beforeend', groupHTML);

                const tbody = document.getElementById(`tbody_${group.id}`);

                group.accounts.forEach(accountName => {
                    const safeId = getSafeId(accountName);
                    
                    const savedBalance = localStorage.getItem(`balance_${safeId}`) || '';
                    const savedSpend = localStorage.getItem(`spend_${safeId}`) || '';
                    const savedTax = localStorage.getItem(`tax_${safeId}`) || '11'; // Default PPN 11%
                    const savedRent = localStorage.getItem(`rent_${safeId}`) || '';
                    
                    const isMJO = accountName.includes("MJO");

                    const formattedBalance = savedBalance ? formatRupiahValue(savedBalance) : '';
                    const formattedSpend = savedSpend ? formatRupiahValue(savedSpend) : '';

                    const rowHTML = `
                        <tr class="hover:bg-gray-700/20 transition-colors group">
                            <td class="py-3 px-3 font-medium text-gray-200 text-sm w-1/4">${accountName}</td>
                            <td class="py-3 px-2">
                                ${isMJO ? `
                                <div class="flex flex-col gap-1 items-center">
                                    <input type="date" id="rent_${safeId}" value="${savedRent}" onchange="handleRentInput('${safeId}')" 
                                        class="w-full bg-gray-900 border border-gray-700/80 rounded-md px-1 py-1 text-gray-300 focus:outline-none focus:ring-1 focus:ring-blue-500 text-xs shadow-inner cursor-pointer" style="color-scheme: dark;">
                                    <span id="rent_status_${safeId}" class="text-[10px] font-bold text-center w-full mt-0.5">-</span>
                                </div>
                                ` : `<div class="text-center text-gray-600 text-xs">-</div>`}
                            </td>
                            <td class="py-3 px-2">
                                <input type="text" id="balance_${safeId}" value="${formattedBalance}" oninput="handleInput('${safeId}')" placeholder="Rp 0" 
                                    class="w-full bg-gray-900 border border-gray-700/80 rounded-md px-2 py-1.5 text-white focus:outline-none focus:ring-1 focus:ring-blue-500 focus:border-blue-500 font-mono text-sm text-right shadow-inner transition-all placeholder-gray-600">
                            </td>
                            <td class="py-3 px-2">
                                <input type="text" id="spend_${safeId}" value="${formattedSpend}" oninput="handleInput('${safeId}')" placeholder="Rp 0" 
                                    class="w-full bg-gray-900 border border-gray-700/80 rounded-md px-2 py-1.5 text-white focus:outline-none focus:ring-1 focus:ring-blue-500 focus:border-blue-500 font-mono text-sm text-right shadow-inner transition-all placeholder-gray-600">
                            </td>
                            <td class="py-3 px-2">
                                <div class="relative flex items-center justify-center">
                                    <input type="text" id="tax_${safeId}" value="${savedTax}" oninput="handleInput('${safeId}')" placeholder="11" 
                                        class="w-16 bg-gray-900 border border-gray-700/80 rounded-md px-2 py-1.5 pr-5 text-white focus:outline-none focus:ring-1 focus:ring-blue-500 focus:border-blue-500 font-mono text-sm text-right shadow-inner transition-all placeholder-gray-600">
                                    <span class="absolute right-3 top-1.5 text-gray-500 text-xs font-bold pointer-events-none">%</span>
                                </div>
                            </td>
                            <td class="py-3 px-2 text-right font-mono text-sm font-semibold text-gray-300" id="total_spend_${safeId}">-</td>
                            <td class="py-3 px-3 text-center font-bold text-sm" id="result_${safeId}">-</td>
                        </tr>
                    `;
                    tbody.insertAdjacentHTML('beforeend', rowHTML);

                    if(savedBalance || savedSpend || savedTax) {
                        calculateDays(safeId, cleanToNumber(savedBalance), cleanToNumber(savedSpend), parseFloat(savedTax) || 0);
                    }
                    
                    if(isMJO) {
                        calculateRentDays(safeId, savedRent);
                    }
                });
            });
        }

        renderTables();

        // ================= FUNGSI FORMAT & KALKULASI ================= //

        function formatRupiahValue(value) {
            const numberString = value.toString().replace(/[^,\d]/g, '');
            if(!numberString) return '';
            const split = numberString.split(',');
            const sisa = split[0].length % 3;
            let rupiah = split[0].substr(0, sisa);
            const ribuan = split[0].substr(sisa).match(/\d{3}/gi);

            if (ribuan) {
                const separator = sisa ? '.' : '';
                rupiah += separator + ribuan.join('.');
            }
            return 'Rp ' + rupiah;
        }

        function cleanToNumber(value) {
            return parseFloat(value.toString().replace(/[^0-9]/g, '')) || 0;
        }

        function handleInput(safeId) {
            const balanceInput = document.getElementById(`balance_${safeId}`);
            const spendInput = document.getElementById(`spend_${safeId}`);
            const taxInput = document.getElementById(`tax_${safeId}`); 

            const rawBalance = cleanToNumber(balanceInput.value);
            const rawSpend = cleanToNumber(spendInput.value);
            
            // Format input persen agar hanya bisa menerima angka dan desimal
            let rawTaxString = taxInput.value.replace(/[^0-9.]/g, '');
            taxInput.value = rawTaxString;
            const rawTaxPercent = parseFloat(rawTaxString) || 0;

            balanceInput.value = balanceInput.value ? formatRupiahValue(rawBalance) : '';
            spendInput.value = spendInput.value ? formatRupiahValue(rawSpend) : '';

            localStorage.setItem(`balance_${safeId}`, rawBalance ? rawBalance : '');
            localStorage.setItem(`spend_${safeId}`, rawSpend ? rawSpend : '');
            localStorage.setItem(`tax_${safeId}`, rawTaxString);

            calculateDays(safeId, rawBalance, rawSpend, rawTaxPercent);
        }

        function calculateDays(safeId, balance, spend, taxPercent) {
            const totalCell = document.getElementById(`total_spend_${safeId}`);
            const resultCell = document.getElementById(`result_${safeId}`);

            if (spend <= 0) {
                totalCell.innerText = "-";
                resultCell.innerText = "-";
                resultCell.className = "py-3 px-3 text-center font-bold text-gray-500";
                return;
            }

            // Hitung Rupiah dari persentase PPN
            const taxNominal = spend * (taxPercent / 100);
            
            // Total Potongan Harian = Spend Iklan + PPN
            const totalDailyCut = Math.round(spend + taxNominal);

            totalCell.innerText = formatRupiahValue(totalDailyCut);

            const daysLeft = balance / totalDailyCut;
            
            if (daysLeft <= 2.0) {
                resultCell.innerHTML = `<span class="bg-red-900/40 text-red-400 border border-red-500/30 px-2 py-1 rounded-md animate-pulse whitespace-nowrap inline-block">${daysLeft.toFixed(1)} Hari 🚨</span>`;
            } else if (daysLeft > 2.0 && daysLeft <= 3.0) {
                resultCell.innerHTML = `<span class="bg-yellow-900/40 text-yellow-400 border border-yellow-500/30 px-2 py-1 rounded-md whitespace-nowrap inline-block">${daysLeft.toFixed(1)} Hari ⚠️</span>`;
            } else {
                resultCell.innerHTML = `<span class="bg-green-900/40 text-green-400 border border-green-500/30 px-2 py-1 rounded-md whitespace-nowrap inline-block">${daysLeft.toFixed(1)} Hari ✅</span>`;
            }
        }

        function handleRentInput(safeId) {
            const rentInput = document.getElementById(`rent_${safeId}`);
            const dateVal = rentInput.value;
            localStorage.setItem(`rent_${safeId}`, dateVal);
            calculateRentDays(safeId, dateVal);
        }

        function calculateRentDays(safeId, dateStr) {
            const statusSpan = document.getElementById(`rent_status_${safeId}`);
            if (!statusSpan) return;
            
            if (!dateStr) {
                statusSpan.innerHTML = "-";
                return;
            }

            // Ambil waktu dari input YYYY-MM-DD
            const parts = dateStr.split('-');
            const rentDate = new Date(parts[0], parts[1] - 1, parts[2]);
            rentDate.setHours(0,0,0,0);
            
            const today = new Date();
            today.setHours(0,0,0,0);
            
            const diffTime = rentDate - today;
            const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));
            
            if (diffDays < 0) {
                statusSpan.innerHTML = `<span class="text-red-400 bg-red-900/40 px-1.5 py-0.5 rounded border border-red-500/30 whitespace-nowrap">Expired ${Math.abs(diffDays)} hr lalu</span>`;
            } else if (diffDays === 0) {
                statusSpan.innerHTML = `<span class="text-yellow-400 bg-yellow-900/40 px-1.5 py-0.5 rounded border border-yellow-500/30 animate-pulse whitespace-nowrap">Hari Ini!</span>`;
            } else if (diffDays <= 3) {
                statusSpan.innerHTML = `<span class="text-yellow-400 bg-yellow-900/40 px-1.5 py-0.5 rounded border border-yellow-500/30 whitespace-nowrap">${diffDays} Hari Lagi ⚠️</span>`;
            } else {
                statusSpan.innerHTML = `<span class="text-green-400 bg-green-900/40 px-1.5 py-0.5 rounded border border-green-500/30 whitespace-nowrap">${diffDays} Hari Lagi</span>`;
            }
        }

        // ================= FUNGSI SISTEM UTAMA ================= //

        function downloadReport() {
            const element = document.getElementById('report-container');
            
            modernScreenshot.domToPng(element, {
                quality: 1,
                scale: 2,
                backgroundColor: '#0f172a' 
            })
            .then(dataUrl => {
                const link = document.createElement('a');
                link.download = `Report_Iklan_${new Date().toISOString().slice(0,10)}.png`;
                link.href = dataUrl;
                link.click();
            })
            .catch(err => {
                console.error("Gagal mendownload gambar:", err);
                alert("Ada gangguan saat mengambil gambar layar. Coba lagi.");
            });
        }

        function clearAllData() {
            if (confirm("Apakah kamu yakin ingin mereset seluruh data (Saldo, Spend, dan PPN)?")) {
                accountGroups.forEach(group => {
                    group.accounts.forEach(accountName => {
                        const safeId = getSafeId(accountName);
                        
                        document.getElementById(`balance_${safeId}`).value = '';
                        document.getElementById(`spend_${safeId}`).value = '';
                        document.getElementById(`tax_${safeId}`).value = '11'; // Kembalikan ke default 11%
                        
                        document.getElementById(`total_spend_${safeId}`).innerText = '-';
                        document.getElementById(`result_${safeId}`).innerHTML = '-';
                        document.getElementById(`result_${safeId}`).className = "py-3 px-3 text-center font-bold text-gray-500";
                        
                        if (document.getElementById(`rent_${safeId}`)) {
                            document.getElementById(`rent_${safeId}`).value = '';
                            document.getElementById(`rent_status_${safeId}`).innerHTML = '-';
                            localStorage.removeItem(`rent_${safeId}`);
                        }
                        
                        localStorage.removeItem(`balance_${safeId}`);
                        localStorage.removeItem(`spend_${safeId}`);
                        localStorage.setItem(`tax_${safeId}`, '11');
                    });
                });
            }
        }
    </script>
</body>
</html>
