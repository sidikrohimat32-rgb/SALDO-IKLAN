<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Pantau Saldo Iklan</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://unpkg.com/modern-screenshot"></script>
</head>
<body class="bg-gray-900 text-gray-100 min-h-screen p-4 md:p-8">

    <div class="max-w-7xl mx-auto">
        <div class="flex flex-col md:flex-row md:items-center md:justify-between mb-8 gap-4">
            <div>
                <h1 class="text-3xl font-bold text-blue-400">📊 Ads Balance Monitor</h1>
                <p class="text-gray-400 text-sm mt-1">Pantau sisa saldo dan estimasi umur iklan agar tidak kecolongan off.</p>
            </div>
            <div class="flex gap-3">
                <button onclick="downloadReport()" class="bg-green-600 hover:bg-green-700 text-white font-semibold py-2px px-4 rounded-lg shadow transition duration-200 flex items-center gap-2 cursor-pointer h-11">
                    💾 Download Gambar
                </button>
                <button onclick="clearAllData()" class="bg-red-600/30 hover:bg-red-600 text-red-300 hover:text-white border border-red-500/50 font-semibold py-2px px-4 rounded-lg transition duration-200 cursor-pointer h-11">
                    🗑️ Hapus Semua Data
                </button>
            </div>
        </div>

        <div id="report-table" class="bg-gray-800 rounded-xl shadow-xl overflow-hidden border border-gray-700 p-4 md:p-6">
            <div class="mb-4 flex justify-between items-center border-b border-gray-700 pb-3">
                <span class="text-xs font-semibold uppercase tracking-wider text-gray-400">Laporan Saldo & Estimasi Iklan (Termasuk PPN 11%)</span>
                <span id="current-date" class="text-sm text-gray-400 font-mono"></span>
            </div>
            
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="border-b border-gray-700 text-gray-400 text-sm">
                            <th class="pb-3 pt-2 font-semibold">Nama Akun Iklan</th>
                            <th class="pb-3 pt-2 font-semibold w-44 text-right">Sisa Saldo</th>
                            <th class="pb-3 pt-2 font-semibold w-44 text-right">Spend Kemarin</th>
                            <th class="pb-3 pt-2 font-semibold w-44 text-right text-amber-400">Spend + PPN 11%</th>
                            <th class="pb-3 pt-2 font-semibold text-center w-48">Estimasi Sisa Hari</th>
                        </tr>
                    </thead>
                    <tbody id="ads-table-body" class="divide-y divide-gray-700/50">
                        </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        // Daftar akun iklan
        const accountNames = [
            "NISA TESTER",
            "KANTOR MJO 1372 (RAHASIA CANTIK)",
            "KANTOR MJO 0696 (DAILY CK)",
            "KANTOR MJO 0682 (FINDURFAV)",
            "AKUN IKLAN BARU (DAPUR)",
            "KANTOR MJO 0435 (DAPUR)",
            "AKUN IKLAN EVAN (RACOEN)",
            "KANTOR MJO 0434 (RACOEN)"
        ];

        // Tampilkan tanggal hari ini
        const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
        document.getElementById('current-date').innerText = new Date().toLocaleDateString('id-ID', options);

        // Inisialisasi & Load data dari LocalStorage
        const tableBody = document.getElementById('ads-table-body');
        
        accountNames.forEach((name, index) => {
            const savedBalance = localStorage.getItem(`balance_${index}`) || '';
            const savedSpend = localStorage.getItem(`spend_${index}`) || '';

            const formattedBalance = savedBalance ? formatRupiahValue(savedBalance) : '';
            const formattedSpend = savedSpend ? formatRupiahValue(savedSpend) : '';

            const row = document.createElement('tr');
            row.className = "hover:bg-gray-700/30 transition-colors";
            row.innerHTML = `
                <td class="py-4 pr-3 font-medium text-gray-200">${name}</td>
                <td class="py-4 pr-3">
                    <input type="text" id="balance_${index}" value="${formattedBalance}" oninput="handleInput(${index})" placeholder="Rp 0" 
                        class="w-full bg-gray-950 border border-gray-700 rounded px-3 py-1.5 text-white focus:outline-none focus:border-blue-500 font-mono text-sm text-right">
                </td>
                <td class="py-4 pr-3">
                    <input type="text" id="spend_${index}" value="${formattedSpend}" oninput="handleInput(${index})" placeholder="Rp 0" 
                        class="w-full bg-gray-950 border border-gray-700 rounded px-3 py-1.5 text-white focus:outline-none focus:border-blue-500 font-mono text-sm text-right">
                </td>
                <td class="py-4 pr-3 text-right font-mono text-sm text-amber-400 font-semibold" id="tax_spend_${index}">-</td>
                <td class="py-4 text-center font-bold text-sm" id="result_${index}">-</td>
            `;
            tableBody.appendChild(row);
            
            if(savedBalance && savedSpend) {
                calculateDays(index, parseFloat(savedBalance), parseFloat(savedSpend));
            }
        });

        // Fungsi memformat angka murni menjadi format Rupiah string (Accounting Style)
        function formatRupiahValue(value) {
            const numberString = value.replace(/[^,\d]/g, '').toString();
            const split = numberString.split(',');
            const sisa = split[0].length % 3;
            let rupiah = split[0].substr(0, sisa);
            const ribuan = split[0].substr(sisa).match(/\d{3}/gi);

            if (ribuan) {
                const separator = sisa ? '.' : '';
                rupiah += separator + ribuan.join('.');
            }

            rupiah = split[1] != undefined ? rupiah + ',' + split[1] : rupiah;
            return rupiah ? 'Rp ' + rupiah : '';
        }

        // Fungsi mengubah string Rupiah kembali ke Angka Murni untuk kalkulasi
        function cleanToNumber(value) {
            return parseFloat(value.replace(/[^0-9]/g, '')) || 0;
        }

        // Menghandle input ketikan secara real-time
        function handleInput(index) {
            const balanceInput = document.getElementById(`balance_${index}`);
            const spendInput = document.getElementById(`spend_${index}`);

            const rawBalance = cleanToNumber(balanceInput.value);
            const rawSpend = cleanToNumber(spendInput.value);

            balanceInput.value = balanceInput.value ? formatRupiahValue(rawBalance.toString()) : '';
            spendInput.value = spendInput.value ? formatRupiahValue(rawSpend.toString()) : '';

            localStorage.setItem(`balance_${index}`, rawBalance ? rawBalance : '');
            localStorage.setItem(`spend_${index}`, rawSpend ? rawSpend : '');

            calculateDays(index, rawBalance, rawSpend);
        }

        // Fungsi Hitung Otomatis PPN 11% & Aturan Kustom Estimasi Hari
        function calculateDays(index, balance, spend) {
            const taxSpendCell = document.getElementById(`tax_spend_${index}`);
            const resultCell = document.getElementById(`result_${index}`);

            if (spend <= 0) {
                taxSpendCell.innerText = "-";
                resultCell.innerText = "-";
                resultCell.className = "py-4 text-center font-bold text-gray-400";
                return;
            }

            const totalSpendWithTax = Math.round(spend * 1.11);
            taxSpendCell.innerText = formatRupiahValue(totalSpendWithTax.toString());

            const daysLeft = balance / totalSpendWithTax;
            
            // Logika kustom indikator tingkat kritis
            if (daysLeft <= 1.2) {
                resultCell.innerText = `${daysLeft.toFixed(1)} Hari (Segera Isi! 🚨)`;
                resultCell.className = "py-4 text-center font-bold text-red-400 animate-pulse";
            } else if (daysLeft > 1.2 && daysLeft <= 3.0) {
                resultCell.innerText = `${daysLeft.toFixed(1)} Hari (Hati-Hati ⚠️)`;
                resultCell.className = "py-4 text-center font-bold text-yellow-400";
            } else {
                resultCell.innerText = `${daysLeft.toFixed(1)} Hari (Aman ✅)`;
                resultCell.className = "py-4 text-center font-bold text-green-400";
            }
        }

        // Fungsi Download Gambar Menggunakan Library Baru (Anti Gagal & Ringan)
        function downloadReport() {
            const element = document.getElementById('report-table');
            
            // Menggunakan modernScreenshot untuk menangkap elemen secara instan dan akurat
            modernScreenshot.domToPng(element, {
                quality: 0.95,
                scale: 2
            })
            .then(dataUrl => {
                const link = document.createElement('a');
                link.download = `Laporan_Saldo_Iklan_${new Date().toISOString().slice(0,10)}.png`;
                link.href = dataUrl;
                link.click();
            })
            .catch(err => {
                console.error("Gagal mendownload gambar:", err);
                alert("Ada gangguan eksternal pada browser. Silakan coba kembali beberapa saat lagi.");
            });
        }

        // Fungsi Hapus Semua Data
        function clearAllData() {
            if (confirm("Apakah kamu yakin ingin menghapus semua data input saldo dan spend?")) {
                accountNames.forEach((_, index) => {
                    document.getElementById(`balance_${index}`).value = '';
                    document.getElementById(`spend_${index}`).value = '';
                    document.getElementById(`tax_spend_${index}`).innerText = '-';
                    document.getElementById(`result_${index}`).innerText = '-';
                    document.getElementById(`result_${index}`).className = "py-4 text-center font-bold text-gray-400";
                    
                    localStorage.removeItem(`balance_${index}`);
                    localStorage.removeItem(`spend_${index}`);
                });
            }
        }
    </script>
</body>
</html>
